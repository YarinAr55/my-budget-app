<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מעקב תקציב אישי</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --danger: #ef4444;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 20px;
            display: flex; justify-content: center;
        }
        .container {
            width: 100%; max-width: 600px;
            background: var(--card-bg); padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        h1 { text-align: center; color: var(--primary); margin-bottom: 20px; }
        
        .month-selector {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f1f5f9;
            padding: 10px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .month-btn {
            background: white;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .month-btn:hover { background: #e2e8f0; }

        .summary-card {
            background: #eff6ff; border: 1px solid #bfdbfe;
            padding: 16px; border-radius: 12px;
            text-align: center; margin-bottom: 24px;
        }
        .summary-card .amount { font-size: 1.5rem; font-weight: bold; color: var(--primary); }
        form { display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-weight: 600; font-size: 0.9rem; }
        input, select {
            padding: 10px 12px; border: 1px solid var(--border-color);
            border-radius: 8px; font-size: 1rem; outline: none;
        }
        button.btn-submit {
            background-color: var(--primary); color: white;
            border: none; padding: 12px; border-radius: 8px;
            font-size: 1rem; font-weight: bold; cursor: pointer;
        }
        button.btn-submit:hover { background-color: var(--primary-hover); }
        .expense-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; max-height: 250px; overflow-y: auto; }
        .expense-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px; background: #f8fafc; border: 1px solid var(--border-color);
            border-radius: 8px;
        }
        .expense-amount { font-weight: bold; color: var(--danger); }
        .btn-delete { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 1.2rem; }
        .btn-delete:hover { color: var(--danger); }
        .empty-state { text-align: center; color: #94a3b8; padding: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>מעקב תקציב אישי</h1>

        <div class="month-selector">
            <button class="month-btn" onclick="changeMonth(-1)">&#9664; חודש קודם</button>
            <span id="current-month-label">חודש נוכחי</span>
            <button class="month-btn" onclick="changeMonth(1)">חודש הבא &#9654;</button>
        </div>

        <div class="summary-card">
            <h3 id="summary-title">סה"כ הוצאות לחודש זה</h3>
            <div class="amount" id="total-amount">0.00 ₪</div>
        </div>

        <form id="expense-form">
            <div class="form-group">
                <label for="amount">סכום (ב-₪)</label>
                <input type="number" id="amount" step="0.01" required placeholder="למשל: 50">
            </div>
            <div class="form-group">
                <label for="category">קטגוריה</label>
                <select id="category" required>
                    <option value="" disabled selected>בחר קטגוריה</option>
                    <option value="אוכל ומסעדות">אוכל ומסעדות</option>
                    <option value="תחבורה">תחבורה</option>
                    <option value="קניות ופנאי">קניות ופנאי</option>
                    <option value="חשבונות ושונות">חשבונות ושונות</option>
                </select>
            </div>
            <div class="form-group">
                <label for="note">הערה (אופציונלי)</label>
                <input type="text" id="note" placeholder="למשל: קפה ועוגה">
            </div>
            <button type="submit" class="btn-submit">הוסף הוצאה</button>
        </form>

        <div class="history-section">
            <h2>היסטוריית הוצאות לחודש הנבחר</h2>
            <ul id="expense-list" class="expense-list"></ul>
        </div>
    </div>
    <script>
        let expenses = JSON.parse(localStorage.getItem('expenses')) || [];
        
        // מעקב אחרי החודש והשנה שמוצגים כרגע (מתחיל בחודש הנוכחי)
        let today = new Date();
        let displayYear = today.getFullYear();
        let displayMonth = today.getMonth(); // 0-11

        const monthNames = [
            "ינואר", "פברואר", "מרץ", "אפֿריל", "מאי", "יוני",
            "יולי", "אוגוסט", "ספטמבר", "אוקטובר", "נובמבר", "דצמבר"
        ];

        const form = document.getElementById('expense-form');
        const amountInput = document.getElementById('amount');
        const categorySelect = document.getElementById('category');
        const noteInput = document.getElementById('note');
        const expenseList = document.getElementById('expense-list');
        const totalAmountEl = document.getElementById('total-amount');
        const monthLabel = document.getElementById('current-month-label');

        function changeMonth(direction) {
            displayMonth += direction;
            if (displayMonth > 11) {
                displayMonth = 0;
                displayYear++;
            } else if (displayMonth < 0) {
                displayMonth = 11;
                displayYear--;
            }
            render();
        }

        function saveAndRender() {
            localStorage.setItem('expenses', JSON.stringify(expenses));
            render();
        }

        function render() {
            monthLabel.textContent = `${monthNames[displayMonth]} ${displayYear}`;
            
            // סינון הוצאות לפי החודש והשנה שנבחרו
            const filteredExpenses = expenses.filter(exp => {
                const expDate = new Date(exp.rawDate);
                return expDate.getFullYear() === displayYear && expDate.getMonth() === displayMonth;
            });

            expenseList.innerHTML = '';
            let total = 0;

            if (filteredExpenses.length === 0) {
                expenseList.innerHTML = '<li class="empty-state">אין הוצאות רשומות לחודש זה.</li>';
                totalAmountEl.textContent = '0.00 ₪';
                return;
            }

            filteredExpenses.slice().reverse().forEach((exp) => {
                // מציאת האינדקס האמיתי במערך המקורי לצורך מחיקה מדויקת
                const originalIndex = expenses.indexOf(exp);
                total += parseFloat(exp.amount);

                const li = document.createElement('li');
                li.className = 'expense-item';
                li.innerHTML = `
                    <div>
                        <strong>${exp.category}</strong><br>
                        <small style="color: #64748b;">${exp.dateStr} ${exp.note ? '• ' + exp.note : ''}</small>
                    </div>
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <span class="expense-amount">-${parseFloat(exp.amount).toFixed(2)} ₪</span>
                        <button class="btn-delete" onclick="deleteExpense(${originalIndex})">&times;</button>
                    </div>
                `;
                expenseList.appendChild(li);
            });

            totalAmountEl.textContent = total.toFixed(2) + ' ₪';
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const amount = parseFloat(amountInput.value);
            const category = categorySelect.value;
            const note = noteInput.value.trim();
            if (!amount || !category) return;

            const now = new Date();
            const dateStr = now.toLocaleDateString('he-IL') + ' ' + now.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });

            expenses.push({
                amount,
                category,
                note,
                dateStr,
                rawDate: now.toISOString() // שומרים תאריך מדויק כדי לדעת לאיזה חודש לשייך
            });

            // נעביר את התצוגה אוטומטית לחודש שבו נוספה ההוצאה (החודש הנוכחי)
            displayYear = now.getFullYear();
            displayMonth = now.getMonth();

            saveAndRender();
            form.reset();
        });

        window.deleteExpense = function(index) {
            expenses.splice(index, 1);
            saveAndRender();
        };

        render();
    </script>
</body>
</html>
