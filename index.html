<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מעקב תקציב אישי</title>
    <!-- טעינת ספריית הגרפים Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- טעינת תוסף להצגת תוויות על גבי הגרף -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 15px;
            display: flex; justify-content: center;
        }
        .container {
            width: 100%; max-width: 600px;
            background: var(--card-bg); padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        h1 { text-align: center; color: var(--primary); margin-bottom: 15px; font-size: 1.5rem; }

        /* בר ניווט בין חודשים */
        .month-navigator {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #e2e8f0;
            padding: 8px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: bold;
            color: var(--text-color);
        }
        .month-navigator button {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 36px;
            height: 36px;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .month-navigator button:hover {
            background: #f1f5f9;
        }

        .summary-card {
            background: #eff6ff; border: 1px solid #bfdbfe;
            padding: 16px; border-radius: 12px;
            text-align: center; margin-bottom: 20px;
        }
        .summary-card .amount { font-size: 1.5rem; font-weight: bold; color: var(--primary); }
        
        .budget-progress-container {
            margin-top: 10px;
            background: #e2e8f0;
            border-radius: 8px;
            height: 10px;
            overflow: hidden;
        }
        .budget-progress-bar {
            height: 100%;
            width: 0%;
            background: var(--success);
            transition: width 0.4s, background-color 0.4s;
        }
        .budget-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 6px;
        }
        .btn-budget-edit {
            background: none; border: none; color: var(--primary);
            cursor: pointer; font-size: 0.85rem; text-decoration: underline; margin-top: 6px; padding: 0;
        }

        .tools-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        .search-input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }
        .btn-export {
            background: #10b981; color: white; border: none;
            padding: 10px 14px; border-radius: 8px; cursor: pointer;
            font-size: 0.9rem; font-weight: bold; white-space: nowrap;
        }

        .chart-container {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .chart-container h3 {
            margin: 0 0 12px 0;
            font-size: 1rem;
            color: var(--text-color);
            align-self: flex-start;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
            width: 100%;
        }
        .canvas-wrapper {
            width: 100%;
            max-width: 280px;
            height: 240px;
            position: relative;
        }

        form { display: flex; flex-direction: column; gap: 14px; margin-bottom: 24px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-weight: 600; font-size: 0.9rem; }
        input, select {
            padding: 12px; border: 1px solid var(--border-color);
            border-radius: 8px; font-size: 1rem; outline: none; background: #fff;
        }
        .checkbox-group {
            flex-direction: row; align-items: center; gap: 10px; cursor: pointer; font-size: 0.9rem;
            background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color);
        }
        .checkbox-group input { width: 20px; height: 20px; cursor: pointer; }

        button.btn-submit {
            background-color: var(--primary); color: white;
            border: none; padding: 14px; border-radius: 8px;
            font-size: 1rem; font-weight: bold; cursor: pointer;
            transition: background 0.2s;
        }

        .history-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 400px;
            overflow-y: auto;
            padding-left: 4px;
        }
        .expense-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
        .expense-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 12px; background: #ffffff; border: 1px solid var(--border-color);
            border-radius: 8px;
        }
        .expense-amount { font-weight: bold; color: var(--danger); }
        .btn-delete { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 1.3rem; padding: 0 4px; }
        .empty-state { text-align: center; color: #94a3b8; padding: 15px; font-size: 0.9rem; }

        .fixed-section {
            background: #fdf4ff;
            border: 1px solid #f0abfc;
            border-radius: 12px;
            padding: 16px;
            margin-top: 25px;
        }
        .fixed-section h2 { color: #86198f; font-size: 1.1rem; margin-top: 0; margin-bottom: 12px; border-bottom: 1px solid #f0abfc; padding-bottom: 6px; }
        .fixed-item {
            display: flex; justify-content: space-between; align-items: center;
            background: white; padding: 10px 12px; border-radius: 8px;
            border: 1px solid #f5d0fe; margin-bottom: 8px;
        }
        .fixed-total {
            text-align: left; font-weight: bold; color: #86198f; margin-top: 10px; font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>מעקב תקציב אישי</h1>

        <!-- ניווט בין חודשים (חץ ימינה ושמאלה) -->
        <div class="month-navigator">
            <button onclick="changeMonth(-1)" title="חודש קודם">&#9658;</button>
            <span id="current-month-label">ינואר 2026</span>
            <button onclick="changeMonth(1)" title="חודש הבא">&#9668;</button>
        </div>

        <div class="summary-card">
            <h3 style="margin:0 0 6px 0; font-size:1rem;">סה"כ הוצאות משתנות לחודש הנבחר</h3>
            <div class="amount" id="total-amount">0.00 ₪</div>
            <div style="font-size: 0.85rem; color: #64748b; margin-top: 4px;" id="total-combined-text">כולל קבועות ברקע: 0.00 ₪</div>
            
            <div class="budget-progress-container">
                <div id="progress-bar" class="budget-progress-bar"></div>
            </div>
            <div class="budget-info">
                <span id="budget-status-text">לא הוגדר תקציב</span>
                <span id="budget-max-text"></span>
            </div>
            <button class="btn-budget-edit" onclick="setMonthlyBudget()">הגדר/שנה תקציב לחודש זה</button>
        </div>

        <div class="tools-bar">
            <input type="text" id="search-input" class="search-input" placeholder="חיפוש לפי הערה או קטגוריה בחודש הנבחר..." oninput="render()">
            <button class="btn-export" onclick="exportToExcel()">ייצוא לאקסל</button>
        </div>

        <div class="chart-container">
            <h3>התפלגות הוצאות משתנות בחודש הנבחר</h3>
            <div class="canvas-wrapper">
                <canvas id="budgetChart"></canvas>
            </div>
        </div>

        <form id="expense-form">
            <h3 style="margin: 0; font-size: 1.1rem; color: var(--primary);">הוספת הוצאה חדשה</h3>
            <div class="form-group">
                <label for="amount">סכום (ב-₪)</label>
                <input type="number" id="amount" step="0.01" required placeholder="למשל: 50">
            </div>
            <div class="form-group">
                <label for="category">קטגוריה</label>
                <select id="category" required>
                    <option value="" disabled selected>בחר קטגוריה</option>
                    <option value="אוכל ומסעדות">אוכל ומסעדות</option>
                    <option value="סופרמרקט וקניות">סופרמרקט וקניות</option>
                    <option value="רכב ודלק">רכב ודלק</option>
                    <option value="תחבורה ציבורית">תחבורה ציבורית</option>
                    <option value="בילויים ופנאי">בילויים ופנאי</option>
                    <option value="בריאות ופארם">בריאות ופארם</option>
                    <option value="חשבונות ובית">חשבונות ובית</option>
                    <option value="בגדים והנעלה">בגדים והנעלה</option>
                    <option value="טכנולוגיה וגאדג'טים">טכנולוגיה וגאדג'טים</option>
                    <option value="מתנות ותרומות">מתנות ותרומות</option>
                    <option value="שונות">שונות</option>
                </select>
            </div>
            <div class="form-group">
                <label for="note">הערה (אופציונלי)</label>
                <input type="text" id="note" placeholder="למשל: קפה ועוגה">
            </div>
            <div class="form-group checkbox-group">
                <input type="checkbox" id="is-fixed" onchange="toggleFormMode(this)">
                <label for="is-fixed" style="cursor: pointer; font-weight: bold; color: #86198f;">הוצאות קבועות</label>
            </div>
            <button type="submit" id="submit-btn" class="btn-submit">הוסף הוצאה משתנה</button>
        </form>

        <div style="margin-top: 20px;">
            <h2 id="history-header" style="font-size: 1.1rem; margin-bottom: 10px; color: var(--text-color);">הוצאות החודש הנבחר</h2>
            <div id="history-container" class="history-container"></div>
        </div>

        <div class="fixed-section">
            <h2>הוצאות קבועות</h2>
            <ul id="fixed-list" style="list-style: none; padding: 0; margin: 0;"></ul>
            <div id="fixed-total" class="fixed-total">סה"כ הוצאות קבועות: 0.00 ₪</div>
        </div>
    </div>

    <script>
        let expenses = JSON.parse(localStorage.getItem('expenses')) || [];
        let fixedExpenses = JSON.parse(localStorage.getItem('fixedExpenses')) || [];
        let budgets = JSON.parse(localStorage.getItem('budgets')) || {};

        // משתנים לשמירת החודש והשנה המוצגים כרגע במסך
        let viewingDate = new Date();
        let displayYear = viewingDate.getFullYear();
        let displayMonth = viewingDate.getMonth();

        const monthNames = [
            "ינואר", "פברואר", "מרץ", "אפריל", "מאי", "יוני",
            "יולי", "אוגוסט", "ספטמבר", "אוקטובר", "נובמבר", "דצמבר"
        ];

        const categories = [
            "אוכל ומסעדות", "סופרמרקט וקניות", "רכב ודלק", "תחבורה ציבורית", 
            "בילויים ופנאי", "בריאות ופארם", "חשבונות ובית", "בגדים והנעלה", 
            "טכנולוגיה וגאדג'טים", "מתנות ותרומות", "שונות"
        ];
        
        const categoryColors = [
            '#2563eb', '#3b82f6', '#f59e0b', '#fbbf24', 
            '#10b981', '#14b8a6', '#8b5cf6', '#ec4899', 
            '#f43f5e', '#6366f1', '#64748b'
        ];

        let myChart = null;

        const form = document.getElementById('expense-form');
        const amountInput = document.getElementById('amount');
        const categorySelect = document.getElementById('category');
        const noteInput = document.getElementById('note');
        const isFixedInput = document.getElementById('is-fixed');
        const submitBtn = document.getElementById('submit-btn');
        const historyContainer = document.getElementById('history-container');
        const fixedList = document.getElementById('fixed-list');
        const fixedTotalEl = document.getElementById('fixed-total');
        const totalAmountEl = document.getElementById('total-amount');
        const totalCombinedText = document.getElementById('total-combined-text');
        const searchInput = document.getElementById('search-input');
        const progressBar = document.getElementById('progress-bar');
        const budgetStatusText = document.getElementById('budget-status-text');
        const budgetMaxText = document.getElementById('budget-max-text');
        const currentMonthLabel = document.getElementById('current-month-label');
        const historyHeader = document.getElementById('history-header');

        function changeMonth(direction) {
            displayMonth += direction;
            if (displayMonth > 11) {
                displayMonth = 0;
                displayYear++;
            } else if (displayMonth < 0) {
                displayMonth = 11;
                displayYear--;
            }
            render();
        }

        function toggleFormMode(checkbox) {
            if (checkbox.checked) {
                submitBtn.textContent = "הוסף להוצאות הקבועות";
                submitBtn.style.backgroundColor = "#9333ea";
            } else {
                submitBtn.textContent = "הוסף הוצאה משתנה";
                submitBtn.style.backgroundColor = "var(--primary)";
            }
        }

        function initChart(dataValues) {
            const ctx = document.getElementById('budgetChart').getContext('2d');
            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: categories,
                    datasets: [{ data: dataValues, backgroundColor: categoryColors, borderWidth: 1 }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        datalabels: {
                            color: '#1e293b',
                            font: { weight: 'bold', size: 10 },
                            anchor: 'end', align: 'start', offset: 4,
                            formatter: (value) => value > 0 ? value.toFixed(0) + ' ₪' : ''
                        },
                        legend: {
                            position: 'bottom',
                            labels: { font: { size: 10, family: 'system-ui' }, boxWidth: 10, padding: 10 }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) { return ` ${context.label}: ${context.raw.toFixed(2)} ₪`; }
                            }
                        }
                    }
                },
                plugins: [ChartDataLabels]
            });
        }

        function setMonthlyBudget() {
            const currentKey = `${displayYear}-${displayMonth}`;
            const currentVal = budgets[currentKey] || '';
            const input = prompt(`הכנס תקציב מקסימלי לחודש ${monthNames[displayMonth]} ${displayYear}:`, currentVal);
            if (input !== null) {
                const num = parseFloat(input);
                if (!isNaN(num) && num > 0) {
                    budgets[currentKey] = num;
                } else {
                    delete budgets[currentKey];
                }
                localStorage.setItem('budgets', JSON.stringify(budgets));
                render();
            }
        }

        function updateBudgetUI(currentMonthTotal) {
            const currentKey = `${displayYear}-${displayMonth}`;
            const maxBudget = budgets[currentKey];

            if (!maxBudget) {
                progressBar.style.width = '0%';
                budgetStatusText.textContent = 'לא הוגדר תקציב לחודש זה';
                budgetMaxText.textContent = '';
                return;
            }

            const percentage = Math.min((currentMonthTotal / maxBudget) * 100, 100);
            progressBar.style.width = percentage + '%';
            budgetMaxText.textContent = `יעד: ${maxBudget.toFixed(2)} ₪`;

            if (currentMonthTotal > maxBudget) {
                progressBar.style.backgroundColor = 'var(--danger)';
                budgetStatusText.textContent = `⚠️ חריגה ב- ${(currentMonthTotal - maxBudget).toFixed(2)} ₪!`;
                budgetStatusText.style.color = 'var(--danger)';
            } else if (percentage > 85) {
                progressBar.style.backgroundColor = 'var(--warning)';
                budgetStatusText.textContent = `⚠️ מתקרב לתקציב (נותרו ${(maxBudget - currentMonthTotal).toFixed(2)} ₪)`;
                budgetStatusText.style.color = 'var(--warning)';
            } else {
                progressBar.style.backgroundColor = 'var(--success)';
                budgetStatusText.textContent = `✅ בשליטה (נותרו ${(maxBudget - currentMonthTotal).toFixed(2)} ₪)`;
                budgetStatusText.style.color = 'var(--success)';
            }
        }

        function exportToExcel() {
            let csv = '\uFEFFסוג,סכום,קטגוריה,הערה,תאריך\n';
            expenses.forEach(exp => {
                csv += `"משתנה","${exp.amount}","${exp.category}","${exp.note || ''}","${exp.dateStr}"\n`;
            });
            fixedExpenses.forEach(exp => {
                csv += `"קבוע","${exp.amount}","${exp.category}","${exp.note || ''}","תמיד"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `הוצאות_תקציב.csv`;
            a.click();
        }

        function saveAndRender() {
            localStorage.setItem('expenses', JSON.stringify(expenses));
            localStorage.setItem('fixedExpenses', JSON.stringify(fixedExpenses));
            render();
        }

        function render() {
            currentMonthLabel.textContent = `${monthNames[displayMonth]} ${displayYear}`;
            historyHeader.textContent = `פירוט הוצאות - ${monthNames[displayMonth]} ${displayYear}`;

            const searchTerm = searchInput.value.trim().toLowerCase();

            // טעינת רשימת הוצאות קבועות
            fixedList.innerHTML = '';
            let fixedTotal = 0;
            fixedExpenses.forEach(item => fixedTotal += parseFloat(item.amount));

            if (fixedExpenses.length === 0) {
                fixedList.innerHTML = '<li style="text-align: center; color: #94a3b8; padding: 10px; font-size: 0.9rem;">אין הוצאות קבועות מוגדרות.</li>';
            } else {
                fixedExpenses.forEach((item, index) => {
                    const li = document.createElement('li');
                    li.className = 'fixed-item';
                    li.innerHTML = `
                        <div>
                            <strong>${item.category}</strong><br>
                            <small style="color: #64748b;">${item.note || 'ללא הערה'}</small>
                        </div>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <span class="expense-amount" style="color: #86198f;">-${parseFloat(item.amount).toFixed(2)} ₪</span>
                            <button class="btn-delete" onclick="deleteFixedExpense(${index})">&times;</button>
                        </div>
                    `;
                    fixedList.appendChild(li);
                });
            }
            fixedTotalEl.textContent = `סה"כ הוצאות קבועות: ${fixedTotal.toFixed(2)} ₪`;

            // סינון הוצאות משתנות לפי החודש הנבחר כרגע
            let currentMonthTotal = 0;
            let currentCatTotals = {};
            categories.forEach(cat => currentCatTotals[cat] = 0);

            let matchedMonthExpenses = [];

            expenses.forEach((exp) => {
                const d = new Date(exp.rawDate);
                if (d.getFullYear() === displayYear && d.getMonth() === displayMonth) {
                    currentMonthTotal += parseFloat(exp.amount);
                    if (currentCatTotals[exp.category] !== undefined) {
                        currentCatTotals[exp.category] += parseFloat(exp.amount);
                    }
                    matchedMonthExpenses.push(exp);
                }
            });

            totalAmountEl.textContent = currentMonthTotal.toFixed(2) + ' ₪';
            totalCombinedText.textContent = `כולל קבועות ברקע: ${(currentMonthTotal + fixedTotal).toFixed(2)} ₪`;
            updateBudgetUI(currentMonthTotal);
            initChart(categories.map(cat => currentCatTotals[cat]));

            // הצגת רשימת ההוצאות בחודש הנבחר (עם תמיכה בחיפוש)
            historyContainer.innerHTML = '';
            
            let filteredItems = matchedMonthExpenses.filter(exp => {
                if (!searchTerm) return true;
                return exp.category.toLowerCase().includes(searchTerm) || (exp.note && exp.note.toLowerCase().includes(searchTerm));
            });

            if (filteredItems.length === 0) {
                historyContainer.innerHTML = '<div class="empty-state">אין הוצאות רשומות בחודש זה.</div>';
                return;
            }

            let itemsHtml = '<ul class="expense-list">';
            filteredItems.slice().reverse().forEach(exp => {
                const originalIndex = expenses.indexOf(exp);
                itemsHtml += `
                    <li class="expense-item">
                        <div>
                            <strong>${exp.category}</strong><br>
                            <small style="color: #64748b;">${exp.dateStr} ${exp.note ? '• ' + exp.note : ''}</small>
                        </div>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <span class="expense-amount">-${parseFloat(exp.amount).toFixed(2)} ₪</span>
                            <button class="btn-delete" onclick="deleteExpense(${originalIndex})">&times;</button>
                        </div>
                    </li>
                `;
            });
            itemsHtml += '</ul>';
            historyContainer.innerHTML = itemsHtml;
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const amount = parseFloat(amountInput.value);
            const category = categorySelect.value;
            const note = noteInput.value.trim();
            const isFixed = isFixedInput.checked;
            if (!amount || !category) return;

            if (isFixed) {
                fixedExpenses.push({ amount, category, note });
            } else {
                // יוצר תאריך בהתאם לחודש שמוצג כרגע במסך (כדי שאם מדפדפים לחודש קודם ומוסיפים, זה ילך לשם אוטומטית, או להיום אם נמצאים בחודש הנוכחי)
                const now = new Date();
                let targetDate = new Date(displayYear, displayMonth, now.getDate(), now.getHours(), now.getMinutes());
                // אם החודש הנבחר הוא החודש הנוכחי האמיתי, ניקח את השעה והדקה המדויקות של עכשיו
                if (now.getFullYear() === displayYear && now.getMonth() === displayMonth) {
                    targetDate = now;
                }

                const dateStr = targetDate.toLocaleDateString('he-IL') + ' ' + targetDate.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
                expenses.push({
                    amount,
                    category,
                    note,
                    dateStr,
                    rawDate: targetDate.toISOString()
                });
            }

            saveAndRender();
            form.reset();
            isFixedInput.checked = false;
            toggleFormMode(isFixedInput);
        });

        window.deleteExpense = function(index) {
            expenses.splice(index, 1);
            saveAndRender();
        };

        window.deleteFixedExpense = function(index) {
            fixedExpenses.splice(index, 1);
            saveAndRender();
        };

        render();
    </script>
</body>
</html>
